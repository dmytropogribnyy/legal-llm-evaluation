[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-llm-evaluation"
version = "0.3.1"
description = "Contract-review LLM evaluation and EU AI Act evidence mapping"
requires-python = ">=3.11"
authors = [{name = "Dmytro Pogribnyy"}]

[project.optional-dependencies]
openai = ["openai==2.54.0"]

[tool.setuptools.packages.find]
include = ["legal_eval*"]
